<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odds Fantasy</title>
  <link rel="stylesheet" href="/ui/styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Odds Fantasy</h1>
      <div id="leagueIndicator" class="subtle hidden"></div>
    </div>
    <div class="header-actions">
      <span id="rlHeader" class="subtle"></span>
      <span id="netSpin" class="spinner hidden" aria-label="Loading"></span>
      <button id="btnChangeLeague" type="button">Change league</button>
      <button id="btnSettings" type="button" aria-label="Settings" title="Settings">⚙</button>
    </div>
  </header>

  <div id="settingsPanel" class="settings-panel hidden">
    <label for="dataModeSelect">Odds data</label>
    <select id="dataModeSelect">
      <option value="auto" selected>Auto (cached)</option>
      <option value="cache">Cache only</option>
      <option value="fresh">Force fresh on next report load</option>
    </select>
  </div>

  <main>
    <section class="report-shell">
      <div class="report-toolbar">
        <div class="segmented" aria-label="Week">
          <button class="week-toggle active" data-week="this" type="button">This week</button>
          <button class="week-toggle" data-week="next" type="button">Next week</button>
        </div>
        <button id="btnCompareCurves" type="button" disabled>Compare curves</button>
      </div>
      <p class="report-note">Sportsbook-derived fantasy point distributions. Click a player to see the exact lines behind the curve.</p>
      <div id="reportStatus" class="status"></div>
      <div id="playerReport" class="results"></div>
    </section>
  </main>

  <div id="leagueSetupOverlay" class="overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2>Set up your league</h2>
        <button id="leagueSetupClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div id="leagueStepUser">
          <p>Enter your Sleeper username.</p>
          <div class="form-row">
            <input id="leagueUsernameInput" type="text" placeholder="Sleeper username" />
            <button id="leagueUserContinue" type="button">Continue</button>
          </div>
          <div id="leagueUserError" class="error"></div>
        </div>
        <div id="leagueStepLeague" class="hidden">
          <p id="leagueLeaguePrompt">Choose a league.</p>
          <select id="leagueLeagueSelect"></select>
          <div class="form-row">
            <button id="leagueLeagueBack" type="button">Back</button>
            <button id="leagueLeagueContinue" type="button">Continue</button>
          </div>
          <div id="leagueLeagueError" class="error"></div>
        </div>
        <div id="leagueStepTeam" class="hidden">
          <p id="leagueTeamPrompt">Choose your team.</p>
          <select id="leagueTeamSelect"></select>
          <div class="form-row">
            <button id="leagueTeamBack" type="button">Back</button>
            <button id="leagueTeamContinue" type="button">Use this team</button>
          </div>
          <div id="leagueTeamError" class="error"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="detailsOverlay" class="overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2 id="detailsTitle">Player details</h2>
        <button id="detailsClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="detailsBody" class="modal-body"></div>
    </div>
  </div>

  <div id="compareOverlay" class="overlay hidden">
    <div class="modal modal-wide">
      <div class="modal-header">
        <h2>Roster probability curves</h2>
        <button id="compareClose" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="compareBody" class="modal-body"></div>
    </div>
  </div>

  <footer class="build-footer"><span id="buildText">build …</span></footer>

  <script src="/ui/script.js"></script>
  <script src="/ui/details.js"></script>
</body>
</html>
