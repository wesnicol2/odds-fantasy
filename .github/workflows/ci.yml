name: CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.derive.outputs.image_tag }}
    steps:
      - name: Derive image tag from ref
        id: derive
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main)       tag=latest ;;
            refs/heads/feature/*)  tag=test ;;
            *)                     tag= ;;
          esac
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$REF -> tag=${tag:-<none>}"

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  smoke:
    needs: [lint, test]
    if: >-
      startsWith(github.ref, 'refs/heads/feature/') ||
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    uses: ./.github/workflows/smoke.yml

  publish:
    needs: [tag, lint, test, smoke]
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.tag.outputs.image_tag != '' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.smoke.result == 'success'
    uses: ./.github/workflows/publish.yml
    with:
      image_tag: ${{ needs.tag.outputs.image_tag }}
    permissions:
      contents: read
      packages: write
