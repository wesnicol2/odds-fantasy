name: Smoke

on:
  workflow_call:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build application image
        run: |
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg GIT_BRANCH="${GITHUB_REF_NAME}" \
            --build-arg IMAGE_TAG="smoke" \
            -t odds-fantasy-smoke .

      - name: Start container
        run: docker run -d --rm --name odds-fantasy-smoke -p 18000:8000 odds-fantasy-smoke

      - name: Verify container health and UI
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          grep -q '"status": "ok"' /tmp/health.json
          curl --fail --silent http://127.0.0.1:18000/ | grep -q 'Odds Fantasy'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser smoke dependency
        run: |
          python -m pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Exercise report, details, curves, defenses and lineup
        env:
          SMOKE_BASE_URL: http://127.0.0.1:18000
        run: python tests/browser_smoke.py

      - name: Container logs
        if: always()
        run: docker logs odds-fantasy-smoke || true
