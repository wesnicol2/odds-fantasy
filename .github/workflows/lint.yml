name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the rule set and line length from pyproject.toml.
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches syntax errors in any tracked Python file without coupling this
      # workflow to package names or directory layout.
      - name: Compile check
        run: git ls-files -z '*.py' | xargs -0 -r python -m py_compile
