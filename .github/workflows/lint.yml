name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reads the rule set and line length from pyproject.toml.
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches syntax errors in anything ruff happened to skip.
      - name: Compile check
        run: python -m compileall -q oddsfantasy tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Bootstrap only: the lockfile produced here is committed before this dev PR merges,
      # then this becomes npm ci. Direct dependencies are already exact-pinned.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Commit bootstrap lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev/frontend-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Lock frontend dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Frontend format and lint
        working-directory: frontend
        run: npm run check

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build
