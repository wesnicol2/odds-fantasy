name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Reads the rule set and line length from pyproject.toml.
      - name: Ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: check

      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Catches syntax errors in anything ruff happened to skip.
      - name: Compile check
        run: python -m compileall -q oddsfantasy tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Normalize this migration slice with Biome
        if: github.event_name == 'pull_request' && github.head_ref == 'dev/player-workstation'
        run: |
          cd frontend
          npx biome check --write .
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          if ! git diff --cached --quiet; then
            git commit -m "Apply Biome formatting"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Frontend format and lint
        working-directory: frontend
        run: npm run check

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build
